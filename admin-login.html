 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal Login - Apna Khet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#062016);
  overflow-x:hidden;
  position:relative;
  padding:20px;
}

body::before, body::after{
  content:""; position:absolute; width:350px; height:350px; border-radius:50%;
  background:rgba(215,154,30,0.2); filter:blur(140px); z-index:0;
}
body::before{ top:-60px; right:-60px; }
body::after{ bottom:-60px; left:-60px; }

/* HEADER BRAND */
.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
  z-index:2;
}
.brand-logo{
  width:60px; height:60px; border-radius:14px; overflow:hidden; background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.brand-logo img{ width:100%; height:100%; object-fit:cover; }
.brand-title{ color:white; font-size:26px; font-weight:900; }
.brand-sub{ color:#fde047; font-size:12px; }

/* ANIMATED OFFICER & VAULT BOX STAGE */
.vault-stage{
  width:120px;
  height:120px;
  position:relative;
  margin-bottom:18px;
  z-index:2;
}

.officer-icon{
  font-size:60px;
  text-align:center;
  animation:bounceOfficer 2s infinite ease-in-out;
}

.vault-box{
  width:80px; height:60px;
  background:linear-gradient(135deg,#d79a1e,#9a6f11);
  border:2px solid #fef08a;
  border-radius:12px;
  margin:0 auto;
  position:relative;
  box-shadow:0 10px 25px rgba(215,154,30,0.4);
  cursor:pointer;
  animation:boxPulse 1.5s infinite alternate;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
}

@keyframes bounceOfficer{
  0%, 100%{ transform:translateY(0); }
  50%{ transform:translateY(-8px); }
}

@keyframes boxPulse{
  from{ transform:scale(0.95); box-shadow:0 0 15px rgba(215,154,30,0.3); }
  to{ transform:scale(1.05); box-shadow:0 0 30px rgba(215,154,30,0.7); }
}

/* LOGIN CARD */
.login-box{
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  padding:34px 28px;
  width:100%;
  max-width:380px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  z-index:2;
  animation:fadeUp 0.8s ease;
}

.login-box h2{ color:white; font-size:24px; font-weight:800; margin-bottom:6px; }
.login-box p{ color:#9ca3af; font-size:13px; margin-bottom:20px; }

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(0,0,0,0.3);
  color:white;
  outline:none;
  font-size:15px;
  transition:0.3s;
}

input::placeholder{ color:#9ca3af; }
input:focus{ border-color:#d79a1e; box-shadow:0 0 15px rgba(215,154,30,0.5); }

.login-btn{
  width:100%;
  padding:14px;
  margin-top:14px;
  background:#d79a1e;
  border:none;
  color:white;
  font-weight:800;
  font-size:16px;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
}

.login-btn:hover{
  background:#eab308;
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(215,154,30,0.5);
}

.msg{ margin-top:14px; font-weight:700; color:#fde047; font-size:14px; }

/* ANIMATED UNLOCK OVERLAY */
.unlock-overlay{
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  background:rgba(15,23,42,0.96);
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
  animation:fadeIn 0.5s ease;
}

.unlock-icon{
  font-size:80px;
  animation:unlockSpin 1.2s ease forwards;
}

.unlock-text{
  color:#4ade80;
  font-size:26px;
  font-weight:900;
  margin-top:20px;
}

@keyframes unlockSpin{
  0%{ transform:scale(0) rotate(-180deg); }
  60%{ transform:scale(1.3) rotate(20deg); }
  100%{ transform:scale(1) rotate(0deg); }
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(30px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes fadeIn{
  from{ opacity:0; } to{ opacity:1; }
}
</style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="brand-logo">
      <img src="logo pana khet.jpeg" alt="Logo">
    </div>
    <div>
      <div class="brand-title">Apna Khet</div>
      <div class="brand-sub">Admin Decision Support Panel</div>
    </div>
  </div>

  <!-- ANIMATED OFFICER & VAULT BOX -->
  <div class="vault-stage">
    <div class="officer-icon">🧑‍💼</div>
    <div class="vault-box">🔐</div>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-box">
    <h2>🔐 Admin Portal Login</h2>
    <p>Control Room Credentials Darj Karein</p>

    <input type="text" id="username" placeholder="Username (admin)">
    <input type="password" id="password" placeholder="Password (admin123)">
    
    <button class="login-btn" onclick="login()">Unlock Control Panel</button>

    <div class="msg" id="msg"></div>
  </div>

  <!-- UNLOCK OVERLAY -->
  <div class="unlock-overlay" id="unlockOverlay">
    <div class="unlock-icon">🔓</div>
    <div class="unlock-text">Access Granted!</div>
    <p style="color:#a7f3d0; margin-top:10px;">Loading Admin Control Panel...</p>
  </div>

<script>
const API_URL = "http://localhost:3000/api";

async function login(){
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  if(!user || !pass){
    msg.innerHTML = "❌ Please enter username & password";
    return;
  }

  msg.innerHTML = "⏳ Authenticating security token...";

  try{
    const res = await fetch(API, {
      method: "POST",
      body: JSON.stringify({
        action: "adminLogin",
        username: user,
        password: pass
      }),
      headers: { "Content-Type": "text/plain;charset=utf-8" }
    });
    
    const data = await res.json();

    if(data.success){
      localStorage.setItem("admin", "true");

      // ANIMATED VAULT UNLOCK TRIGGER
      document.getElementById("unlockOverlay").style.display = "flex";

      setTimeout(()=>{
        window.location.href = "admin.html";
      }, 1800);

    } else {
      msg.innerHTML = "❌ " + data.message;
    }

  } catch(error){
    msg.innerHTML = "⚠️ Network Error. Check connection.";
  }
}
</script>

</body>
</html>
