 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#022c22);
  overflow:hidden;
}

/* background glow circles */
body::before, body::after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  background:rgba(34,197,94,0.2);
  filter:blur(100px);
}

body::before{
  top:-50px;
  left:-50px;
}

body::after{
  bottom:-50px;
  right:-50px;
}

/* login card */
.login-box{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  padding:40px 30px;
  width:340px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
  animation:fadeIn 1s ease;
}

/* heading */
.login-box h2{
  color:white;
  font-size:26px;
  font-weight:900;
  margin-bottom:25px;
  letter-spacing:1px;
}

/* inputs */
input{
  width:100%;
  padding:14px;
  margin:12px 0;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.05);
  color:white;
  outline:none;
  transition:0.3s;
}

input::placeholder{
  color:#bbb;
}

input:focus{
  border-color:#22c55e;
  box-shadow:0 0 10px rgba(34,197,94,0.6);
}

/* button */
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:#22c55e;
  border:none;
  color:white;
  font-weight:800;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:
    0 0 20px rgba(34,197,94,0.6),
    0 0 40px rgba(34,197,94,0.4);
}

/* message */
.msg{
  margin-top:12px;
  font-weight:700;
  color:#fff;
}

/* animations */
@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<div class="login-box">
  <h2>🔐 Admin Login</h2>

  <input type="text" id="username" placeholder="Enter Username">
  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>

  <div class="msg" id="msg"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxZQcci-TwVfIbRd-Uqt6D5XhQvNTWExRpbQwWfScRUd338QRsV0O1w0bfIgLJthP8w/exec";

async function login() {
  const payload = {
    action: "adminLogin",
    username: document.getElementById("username").value,
    password: document.getElementById("password").value
  };

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(payload),
    headers: {
      "Content-Type": "text/plain"
    }
  });

  const data = await res.json();

  if (data.success) {
    document.getElementById("msg").innerHTML = "✅ Login Success";
    localStorage.setItem("admin", "true");
    setTimeout(() => {
      window.location.href = "admin.html";
    }, 1000);
  } else {
    document.getElementById("msg").innerHTML = "❌ " + data.message;
  }
}
</script>

</body>
</html>
