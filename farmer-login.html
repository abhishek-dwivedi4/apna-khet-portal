  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Login - Apna Khet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#022c22);
  overflow-x:hidden;
  position:relative;
  padding:20px;
}

/* BACKGROUND GLOW LIGHTS */
body::before, body::after{
  content:""; position:absolute; width:350px; height:350px; border-radius:50%;
  background:rgba(34,197,94,0.25); filter:blur(140px); z-index:0;
}
body::before{ top:-60px; left:-60px; }
body::after{ bottom:-60px; right:-60px; }

/* HEADER BRAND */
.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
  z-index:2;
}
.brand-logo{
  width:60px; height:60px; border-radius:14px; overflow:hidden; background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.brand-logo img{ width:100%; height:100%; object-fit:cover; }
.brand-title{ color:white; font-size:26px; font-weight:900; }
.brand-sub{ color:#a7f3d0; font-size:12px; }

/* ANIMATED TRACTOR SPRAY SCENE */
.tractor-stage{
  width:100%;
  max-width:420px;
  height:120px;
  position:relative;
  overflow:hidden;
  border-bottom:3px solid #22c55e;
  margin-bottom:20px;
  border-radius:10px;
  background:rgba(0,0,0,0.2);
  z-index:2;
}

.tractor-wrap{
  position:absolute;
  bottom:0;
  left:-100px;
  animation:driveTractor 8s linear infinite;
  display:flex;
  align-items:flex-end;
}

.tractor-svg{ width:90px; height:60px; }

/* SPRAY PARTICLES */
.spray-cloud{
  width:50px;
  height:40px;
  background:radial-gradient(circle, rgba(167,243,208,0.8) 0%, rgba(34,197,94,0) 70%);
  animation:sprayPulse 0.4s ease-in-out infinite alternate;
  margin-left:-15px;
  margin-bottom:10px;
}

@keyframes driveTractor{
  0%{ left:-100px; }
  100%{ left:100%; }
}

@keyframes sprayPulse{
  from{ transform:scale(0.8); opacity:0.5; }
  to{ transform:scale(1.2); opacity:0.9; }
}

/* LOGIN CARD */
.login-box{
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  padding:34px 28px;
  width:100%;
  max-width:380px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  z-index:2;
  animation:fadeUp 0.8s ease;
}

.login-box h2{ color:white; font-size:24px; font-weight:800; margin-bottom:6px; }
.login-box p{ color:#9ca3af; font-size:13px; margin-bottom:20px; }

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(0,0,0,0.3);
  color:white;
  outline:none;
  font-size:15px;
  transition:0.3s;
}

input::placeholder{ color:#9ca3af; }
input:focus{ border-color:#22c55e; box-shadow:0 0 15px rgba(34,197,94,0.4); }

.login-btn{
  width:100%;
  padding:14px;
  margin-top:14px;
  background:#1f6b2c;
  border:none;
  color:white;
  font-weight:800;
  font-size:16px;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
}

.login-btn:hover{
  background:#22c55e;
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(34,197,94,0.4);
}

.msg{ margin-top:14px; font-weight:700; color:#4ade80; font-size:14px; }

/* CROP HARVEST ANIMATION OVERLAY (ON SUCCESS LOGIN) */
.crop-overlay{
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  background:rgba(2,44,34,0.95);
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
  animation:fadeIn 0.5s ease;
}

.growing-wheat{
  font-size:80px;
  animation:growCrop 1.5s ease-out forwards;
}

.success-text{
  color:#facc15;
  font-size:24px;
  font-weight:900;
  margin-top:20px;
  text-align:center;
  padding:0 20px;
}

@keyframes growCrop{
  0%{ transform:scale(0) translateY(50px); opacity:0; }
  50%{ transform:scale(1.3) translateY(-10px); opacity:1; }
  100%{ transform:scale(1) translateY(0); opacity:1; }
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(30px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes fadeIn{
  from{ opacity:0; } to{ opacity:1; }
}
</style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="brand-logo">
      <img src="logo pana khet.jpeg" alt="Logo">
    </div>
    <div>
      <div class="brand-title">Apna Khet</div>
      <div class="brand-sub">Apna Khet, Apni Pehchaan</div>
    </div>
  </div>

  <!-- ANIMATED TRACTOR SPRAY SCENE -->
  <div class="tractor-stage">
    <div class="tractor-wrap">
      <svg class="tractor-svg" viewBox="0 0 64 64" fill="none">
        <rect x="8" y="24" width="28" height="20" rx="4" fill="#1f6b2c"/>
        <rect x="36" y="16" width="16" height="28" rx="3" fill="#22c55e"/>
        <circle cx="16" cy="48" r="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
        <circle cx="44" cy="48" r="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
        <rect x="4" y="30" width="8" height="6" fill="#d79a1e"/>
      </svg>
      <div class="spray-cloud"></div>
    </div>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-box">
    <h2>🌾 Farmer Login</h2>
    <p>Apna Registered Mobile Number Darj Karein</p>

    <input type="text" id="phone" placeholder="Enter Phone Number (e.g. 8858826519)">
    <button class="login-btn" onclick="login()">Login to Dashboard</button>

    <div class="msg" id="msg"></div>
  </div>

  <!-- CROP ANIMATION OVERLAY -->
  <div class="crop-overlay" id="cropOverlay">
    <div class="growing-wheat">🌾</div>
    <div class="success-text" id="welcomeMsg">Welcome Farmer!</div>
    <p style="color:#a7f3d0; margin-top:10px;">Opening Kisaan Dashboard...</p>
  </div>

<script>
// YAHAN APNA GOOGLE APPS SCRIPT KA "ANYONE" WALA NAYA LINK DAALNA HAI
const API_URL = "https://script.google.com/macros/s/AKfycbxZQcci-TwVfIbRd-Uqt6D5XhQvNTWExRpbQwWfScRUd338QRsV0O1w0bfIgLJthP8w/exec"; 

async function login(){
  const phone = document.getElementById("phone").value.trim();
  const msg = document.getElementById("msg");

  if(!phone){
    msg.innerHTML = "❌ Please enter phone number";
    return;
  }

  msg.innerHTML = "⏳ Validating credentials...";

  try{
    // Google Apps Script CORS fix: Sending data as URLSearchParams (No headers needed)
    const formData = new URLSearchParams();
    formData.append('action', 'farmerLogin');
    formData.append('phone', phone);

    const res = await fetch(API_URL, {
      method: "POST",
      body: formData
    });
    
    const data = await res.json();

    if(data.success){
      localStorage.setItem("farmerPhone", phone);

      // ANIMATED CROP HARVEST OVERLAY TRIGGER
      document.getElementById("welcomeMsg").innerText = `🌾 Welcome ${data.name || "Farmer"}!`;
      document.getElementById("cropOverlay").style.display = "flex";

      setTimeout(()=>{
        window.location.href = "farmer-dashboard.html";
      }, 2000);

    } else {
      msg.innerHTML = "❌ " + data.message;
    }

  } catch(error){
    msg.innerHTML = "⚠️ Network Error. Please check connection.";
  }
}
</script>

</body>
</html>
